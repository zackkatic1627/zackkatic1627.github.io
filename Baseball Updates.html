                    <div class="space-y-6">

        function renderSlide() {
            document.getElementById('slideTitle').textContent = slides[currentSlide].title;
            document.getElementById('slideContent').innerHTML = slides[currentSlide].content;
            document.getElementById('slideCounter').textContent = `Slide ${currentSlide + 1} of ${slides.length}`;
            
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;
            
            renderDots();
        }

        function renderDots() {
            const dotsContainer = document.getElementById('dots');
            dotsContainer.innerHTML = '';
            slides.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition ${idx === currentSlide ? 'bg-yellow-400 w-8' : 'bg-gray-400'}`;
                dot.onclick = () => {
                    currentSlide = idx;
                    renderSlide();
                };
                dotsContainer.appendChild(dot);
            });
        }

        document.getElementById('prevBtn').onclick = () => {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        };

        renderSlide();
    </script>
</body>
